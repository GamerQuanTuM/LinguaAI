name: Daily Cron Job

on:
  schedule:
    - cron: '0 0 * * *' # Runs at 00:00 UTC every day

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Word of the Day API
        run: |
          curl -s -X GET "https://linguaai-w13m.onrender.com/api/cron/word-of-the-day" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --connect-timeout 60 \
            --max-time 120 \
            --retry 3 \
            --retry-delay 5 \
            --fail || exit 1
